[project]
name = "aayi"
version = "0.2.0"
description = "Deploy Docker apps to any server with zero downtime and automatic HTTPS"
readme = "README.md"
authors = [
    { name = "Ahmed", email = "thlurte@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "asyncssh>=2.14.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "typer>=0.12.0",
]

[project.scripts]
aayi = "aayi.cli.main:app"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
]
